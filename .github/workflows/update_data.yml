name: Actualizar prediccion diaria

on:
  schedule:
    # 10:00 UTC = 05:00 hora Colombia (UTC-5), cuando los datos de XM del dia
    # anterior ya estan publicados y disponibles en la API.
    - cron: '0 10 * * *'
  workflow_dispatch:
    # Permite lanzar el pipeline manualmente desde la pestana Actions de GitHub.

jobs:
  predecir:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pydataxm holidays requests

      - name: Generar prediccion del dia siguiente
        run: python src/gen_prediccion_diaria.py

      - name: Confirmar y publicar prediccion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/outputs/prediccion_automatica.csv
          git diff --staged --quiet && echo "Sin cambios." || \
            git commit -m "bot: actualiza prediccion automatica $(date -u +%Y-%m-%d) [skip ci]"
          git push
